<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Farmacia Bolaños — Tu farmacia de confianza, siempre a tu lado">
  <!-- Logo oficial Farmacia Bolaños · versión para MODO OSCURO.
       Sin invertir colores ni cambiar el diseño: el símbolo conserva su
       identidad; solo el texto pasa a tonos claros para contraste sobre
       #0F172A, #111827, #121212 y #1E293B. Fondo transparente. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&amp;display=swap');
    text { font-family: 'Poppins', 'Segoe UI', Verdana, Arial, sans-serif; }
  </style>
  <defs>
    <mask id="fbo-lime">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="60" cy="45" r="40" fill="#000"/>
    </mask>
    <mask id="fbo-teal">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="42" cy="58" r="31" fill="#000"/>
    </mask>
  </defs>

  <text x="40" y="100" font-size="66" font-weight="600" letter-spacing="-0.5" fill="#F8FAFC">Farmacia</text>
  <text x="40" y="176" font-size="66" font-weight="600" letter-spacing="-0.5" fill="#F8FAFC">Bolaños</text>

  <g transform="translate(538 8) scale(1.9)">
    <circle cx="50" cy="50" r="47" fill="#B2CE2E" mask="url(#fbo-lime)"/>
    <circle cx="54" cy="49" r="38" fill="#1A82A6" mask="url(#fbo-teal)"/>
    <path d="M48 33h13v11h11v13H61v11H48V57H37V44h11V33Z" fill="#1A82A6" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="40" y="240" font-size="29" font-weight="500" letter-spacing="0.4" fill="#CBD5E1">Tu farmacia de confianza, siempre a tu lado</text>
</svg>
